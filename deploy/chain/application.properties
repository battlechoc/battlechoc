# Yaci Store (bloxbean/yaci-store 2.0.7) as the game's chain index: it keeps only what the API
# reads (apps/api/src/chain/views.sql), the outputs, mints and burns of the user tokens of the
# game's one minting policy (the filters are in application-plugins.yml). Mounted at /app/config/ in the container,
# where Spring Boot looks for it next to the jar's working directory (/app).
#
# The network, the start point, the database and the policy come from docker-compose.yml as
# environment variables (STORE_CARDANO_*, SPRING_DATASOURCE_*, CHAIN_POLICY_ID); nothing secret
# is in this file.

# The stores. Only the UTxO store (address_utxo, tx_input) and the assets store (mints and burns)
# run; the core keeps the sync point (cursor_) on its own. Every store of 2.0.7 that is on unless
# switched off is switched off here; the aggregates that are off by default stay off explicitly,
# so a changed default cannot turn one on. Yaci Store's Flyway still creates the (empty) tables
# of every store in its schema; that is how 2.0.7 works and costs nothing.
store.utxo.enabled=true
store.assets.enabled=true
store.blocks.enabled=false
store.transaction.enabled=false
store.script.enabled=false
store.metadata.enabled=false
store.epoch.enabled=false
store.staking.enabled=false
store.mir.enabled=false
store.governance.enabled=false
store.epoch-aggr.enabled=false
store.account.enabled=false
store.adapot.enabled=false
store.governance-aggr.enabled=false
store.epoch-nonce.enabled=false
store.live.enabled=false
store.assets.ext.enabled=false
store.admin.ui.enabled=false

# No address table: it would hold every address of the chain, not only ours.
store.utxo.save-address=false

# Pruning stays off. Yaci Store 2.0.7 prunes a spent output in chunks, and in each chunk it picks
# the address_utxo rows and the tx_input rows to delete with two separate queries, each limited to
# the first rows by spent_at_block (UtxoStorageImpl.deleteBySpentAndBlockLessThan). When rows of
# the same block straddle a chunk's limit, the two queries can pick different rows: a tx_input row
# goes while its spent output stays, and that output then looks unspent for good, so an item
# would move back to its previous owner. Without pruning the two tables only grow by the outputs
# with a user token of our policy and their spends (a few rows per mint or move).
store.utxo.pruning-enabled=false

# Yaci Store's own REST API: the stores that run answer no requests (the container publishes no
# port either; the API reads the database through views, never this HTTP server).
store.core.api-enabled=false
store.utxo.api-enabled=false
store.assets.api-enabled=false
management.endpoints.web.exposure.include=health

# The log goes to the container's output only (Docker rotates it, see docker-compose.yml), not
# also to a file inside the container.
logging.file.name=
