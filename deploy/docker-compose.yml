# battlechoc backend on a server: Postgres and the API (REST and the live match WebSocket),
# the API from its published image. This file and a `.env` next to it are all a server needs
# (no checkout of the repository): cp .env.example .env, fill it in, then
#   docker compose pull && docker compose up -d
# The API listens on the loopback port 8080 for the host's reverse proxy (nginx, see README.md);
# docker-compose.caddy.yml adds Caddy in Docker instead, docker-compose.local.yml builds the
# API from a checkout and adds the game.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: battlechoc
      POSTGRES_USER: battlechoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battlechoc -d battlechoc"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    # a release (5.3.0) keeps the server on that version until the tag in .env changes;
    # `latest` follows every release with the next `docker compose pull`
    image: ${API_IMAGE:-fabianbormann/battlechoc-api}:${API_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      PORT: 8080
      # the password goes in separately (pg reads PGPASSWORD): in the URL, a slash or other
      # character of a random password would break it (TypeError: Invalid URL)
      DATABASE_URL: postgres://battlechoc@postgres:5432/battlechoc
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # the secret recipe table, mounted read-only (never in the repository or the image)
      RECIPES_FILE: /run/secrets/recipes.json
    volumes:
      - ${RECIPES_PATH:?set RECIPES_PATH in .env}:/run/secrets/recipes.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  # The database's volume is named in .env, so it depends neither on the folder this file lies
  # in nor on a default: a server that started from a checkout (`deploy/`) has its data in
  # `deploy_pgdata` and must keep saying so, or it would start with an empty database.
  pgdata:
    name: ${PGDATA_VOLUME:?set PGDATA_VOLUME in .env - battlechoc_pgdata on a new server, deploy_pgdata on one that ran from a checkout (see README.md)}
