# Local overlay: builds the API from this checkout instead of pulling the published image,
# and adds the game itself, built against that API.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml -p battlechoc-dev up -d --build
# The game runs on http://localhost:3000, the API on http://localhost:8080 (see README.md at
# the repository root).
services:
  api:
    image: battlechoc-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile

  pwa:
    build:
      context: ..
      dockerfile: apps/pwa/Dockerfile
      args:
        VITE_API_URL: ${PWA_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
