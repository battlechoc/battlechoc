# nginx site for the battlechoc API on a VPS: /etc/nginx/sites-available/api.battlechoc.com
# (symlink it into sites-enabled). Plain HTTP; `certbot --nginx -d api.battlechoc.com` adds the
# TLS server block and the redirect. The API runs in Docker on the loopback port 8080
# (deploy/docker-compose.yml) and trusts one proxy for the client's address.
server {
    listen 80;
    listen [::]:80;
    server_name api.battlechoc.com;

    # no access log and no error log: the paths carry codes and names (sign codes, minted items'
    # asset names, challenge codes), error lines (also some at `crit`, such as failed TLS
    # handshakes) name the client's address, and the privacy policy promises no access logs and
    # never writing an address to disk (deploy/README.md, "Looking after it"). The redirect block
    # that `certbot --nginx` adds for port 80 needs these two lines too.
    access_log off;
    error_log /dev/null crit;

    # the live match WebSocket: upgraded connections, open for the length of a match
    location /live {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # the REST API
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
