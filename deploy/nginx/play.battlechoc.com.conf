# nginx site for challenge links on a VPS: /etc/nginx/sites-available/play.battlechoc.com (symlink it
# into sites-enabled). play.battlechoc.com/<code> is a small page of the API (/play/<code>, see
# apps/api/src/playPage.js): chat apps read its link preview, browsers go on to the game. Plain HTTP;
# `certbot --nginx -d play.battlechoc.com` adds the TLS server block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name play.battlechoc.com;

    # no access log and no error log: the paths carry codes and names (sign codes, minted items'
    # asset names, challenge codes), error lines (also some at `crit`, such as failed TLS
    # handshakes) name the client's address, and the privacy policy promises no access logs and
    # never writing an address to disk (deploy/README.md, "Looking after it"). The redirect block
    # that `certbot --nginx` adds for port 80 needs these two lines too.
    access_log off;
    error_log /dev/null crit;

    location / {
        rewrite ^/(.*)$ /play/$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
