# nginx site for challenge links on a VPS: /etc/nginx/sites-available/play.battlechoc.com (symlink it
# into sites-enabled). play.battlechoc.com/<code> is a small page of the API (/play/<code>, see
# apps/api/src/playPage.js): chat apps read its link preview, browsers go on to the game. Plain HTTP;
# `certbot --nginx -d play.battlechoc.com` adds the TLS server block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name play.battlechoc.com;

    location / {
        rewrite ^/(.*)$ /play/$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
