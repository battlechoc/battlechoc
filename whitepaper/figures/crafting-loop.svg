<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 980 450" width="980" height="450" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="From a match to equipment: the crafting loop">
<style>
  .t { fill: #3b2418; }
  .m { fill: #7d6658; }
  .box { fill: #ffffff; stroke: #7b4a2e; stroke-width: 1.5; }
  .chain { fill: #f3ecff; stroke: #4b5fb3; stroke-width: 1.5; }
  .edge { fill: none; stroke: #d9b99b; stroke-width: 6; stroke-linecap: round; }
  .thin { fill: none; stroke: #d9b99b; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 6; }
  @media (prefers-reduced-motion: reduce) { .moving { display: none; } }
</style>
<rect width="980" height="450" rx="10" fill="#fffaf5"/>
<text x="20" y="30" font-size="17" font-weight="700" class="t">From a match to equipment</text>
<text x="20" y="50" font-size="12.5" class="m">Ingredients are game items that spoil. Only equipment is on-chain and tradable. Paying CHOC never buys a chance.</text>

<!-- paths -->
<path id="p-drop" class="edge" d="M220,214 L270,214"/>
<path id="p-cook" class="edge" d="M460,214 L510,214"/>
<path id="p-craft" class="edge" d="M700,214 L750,214"/>
<path id="p-fee" class="edge" d="M605,175 L605,128"/>
<path id="p-loadout" class="edge" d="M800,253 C800,300 700,300 680,330"/>
<path id="p-market" class="edge" d="M880,253 L880,330"/>
<path id="p-salvage" class="thin" d="M760,253 C700,320 420,320 365,253"/>

<!-- nodes -->
<rect x="30" y="175" width="190" height="78" rx="12" class="box"/>
<text x="125" y="203" font-size="14" font-weight="700" text-anchor="middle" class="t">Verified match</text>
<text x="125" y="222" font-size="11.5" text-anchor="middle" class="m">online, hosted by the server,</text>
<text x="125" y="238" font-size="11.5" text-anchor="middle" class="m">against a player or the AI</text>

<rect x="270" y="175" width="190" height="78" rx="12" class="box"/>
<text x="365" y="200" font-size="14" font-weight="700" text-anchor="middle" class="t">Ingredients</text>
<text x="365" y="218" font-size="11.5" text-anchor="middle" class="m">not tradable, they spoil</text>
<rect x="295" y="229" width="140" height="10" rx="5" fill="#eadfd6"/>
<rect x="295" y="229" width="140" height="10" rx="5" fill="#8fbf6a">
  <animate attributeName="width" values="140;0;0" keyTimes="0;0.9;1" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="fill" values="#8fbf6a;#e3a72f;#b23a5b;#b23a5b" keyTimes="0;0.5;0.9;1" dur="7s" repeatCount="indefinite"/>
</rect>
<text x="365" y="250" font-size="10" text-anchor="middle" class="m">shelf life</text>

<rect x="510" y="175" width="190" height="78" rx="12" class="box"/>
<text x="605" y="203" font-size="14" font-weight="700" text-anchor="middle" class="t">Kitchen</text>
<text x="605" y="222" font-size="11.5" text-anchor="middle" class="m">recipe + ingredients</text>
<text x="605" y="238" font-size="11.5" text-anchor="middle" class="m">+ crafting fee in CHOC</text>

<rect x="750" y="175" width="200" height="78" rx="12" class="chain"/>
<text x="850" y="203" font-size="14" font-weight="700" text-anchor="middle" class="t">Equipment</text>
<text x="850" y="222" font-size="11.5" text-anchor="middle" class="m">CIP-68 NFT on Cardano,</text>
<text x="850" y="238" font-size="11.5" text-anchor="middle" class="m">owned by the player</text>

<rect x="510" y="70" width="190" height="58" rx="12" class="chain"/>
<text x="605" y="94" font-size="14" font-weight="700" text-anchor="middle" class="t">Tournament pot</text>
<text x="605" y="113" font-size="11.5" text-anchor="middle" class="m">90 % of the fee (10 % team)</text>

<rect x="590" y="330" width="180" height="62" rx="12" class="box"/>
<text x="680" y="355" font-size="14" font-weight="700" text-anchor="middle" class="t">Loadout</text>
<text x="680" y="374" font-size="11.5" text-anchor="middle" class="m">same budget for everyone</text>

<rect x="790" y="330" width="170" height="62" rx="12" class="box"/>
<text x="875" y="355" font-size="14" font-weight="700" text-anchor="middle" class="t">Market</text>
<text x="875" y="374" font-size="11.5" text-anchor="middle" class="m">sell or swap the item</text>

<text x="560" y="322" font-size="11.5" text-anchor="end" class="m"><tspan font-weight="600" class="t">Salvage:</tspan> burn the item, get half</text>
<text x="560" y="338" font-size="11.5" text-anchor="end" class="m">of the ingredients back (short shelf life)</text>

<!-- legend / notes -->
<rect x="30" y="300" width="14" height="10" rx="2" fill="#ffffff" stroke="#7b4a2e"/>
<text x="50" y="309" font-size="11.5" class="m">off-chain, stored by the server</text>
<rect x="30" y="320" width="14" height="10" rx="2" fill="#f3ecff" stroke="#4b5fb3"/>
<text x="50" y="329" font-size="11.5" class="m">on Cardano</text>
<text x="30" y="420" font-size="11" class="m">A wrong combination in the kitchen uses up its ingredients but never coins. The first correct one reveals the recipe, proven against the season's commitment.</text>

<!-- moving things: ingredients (small dots), item (square), coin -->
<g class="moving">
  <circle r="5" fill="#fff3d6" stroke="#7b4a2e"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath xlink:href="#p-drop"/></animateMotion></circle>
  <circle r="5" fill="#6b3e26"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite"><mpath xlink:href="#p-drop"/></animateMotion></circle>
  <circle r="5" fill="#b23a5b"><animateMotion dur="1.6s" begin="-0.4s" repeatCount="indefinite"><mpath xlink:href="#p-cook"/></animateMotion></circle>
  <circle r="5" fill="#fff3d6" stroke="#7b4a2e"><animateMotion dur="1.6s" begin="-1.2s" repeatCount="indefinite"><mpath xlink:href="#p-cook"/></animateMotion></circle>
  <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#4b5fb3"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath xlink:href="#p-craft"/></animateMotion></rect>
  <circle r="6" fill="#e3a72f" stroke="#7b4a2e" stroke-width="1.2"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath xlink:href="#p-fee"/></animateMotion></circle>
  <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#4b5fb3"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath xlink:href="#p-loadout"/></animateMotion></rect>
  <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#4b5fb3"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite"><mpath xlink:href="#p-market"/></animateMotion></rect>
  <circle r="5" fill="#6b3e26"><animateMotion dur="4s" repeatCount="indefinite"><mpath xlink:href="#p-salvage"/></animateMotion></circle>
</g>
</svg>
