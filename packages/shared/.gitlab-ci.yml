image: node:14-buster

stages:
  - test
  - deploy

test:
  stage: test
  before_script:
    - npm i
  script:
    - npm run test
  coverage: /All\sfiles.*?\s+(\d+.\d+)/
  artifacts:
    expire_in: 20 mins
    paths:
      - node_modules/

deploy:
  stage: deploy
  script:
    - npm config set -- '//gitlab.com/api/v4/projects/16792493/packages/npm/:_authToken' "${CI_JOB_TOKEN}"
    - npm publish --verbose
  only:
    - master
