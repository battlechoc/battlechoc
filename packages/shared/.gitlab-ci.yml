image: node:latest

stages:
  - test
  - deploy

test:
  stage: test
  before_script:
    - npm i
  script:
    - npm run test
  coverage: /All\sfiles.*?\s+(\d+.\d+)/
  artifacts:
    expire_in: 20 mins
    paths:
      - node_modules/

deploy:
  stage: deploy
  script:
    - npm publish --registry=https://gitlab.com/api/v4/projects/16792493/packages/npm/
  only:
    - master
