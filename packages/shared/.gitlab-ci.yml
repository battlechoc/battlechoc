image: node:alpine

stages:
 - test
 - deploy
 
test:
  stage: test
  before_script:
    - npm i
  script:
    - npm run test
  coverage: /All\sfiles.*?\s+(\d+.\d+)/
  artifacts:
    expire_in: 20 mins
    paths:
     - node_modules/

deploy:
  stage: deploy
  script:
    - npm config set registry $ARTIFACTORY_URL
    - npm config set _auth $ARTIFACTORY_CREDENTIALS
    - npm config set email $ARTIFACTORY_EMAIL
    - npm config set always-auth true
    - npm publish
  only:
    - master