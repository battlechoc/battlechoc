image: buildkite/puppeteer

stages:
  - build
  - test
  - deploy

cache:
  paths:
    - node_modules/

build:
  stage: build
  variables:
    CI: "true"
  before_script:
    - export CI_JOB_TIMESTAMP=$(date --utc -Iseconds)
    - export BATTLECHOC_NPM_TOKEN=$CI_JOB_TOKEN
    - npm i
  script:
    - sed -i "s/LOCAL_DATETIME/$CI_JOB_TIMESTAMP/g" src/ui/dialogs/Info.jsx
    - sed -i "s/LOCAL_DATETIME/$CI_JOB_TIMESTAMP/g" src/helper/settings.jsx
    - sed -i "s/NEXT_REVISION/$CI_PIPELINE_ID/g" src/service-worker.js
    - npm run build
  artifacts:
    expire_in: 20 mins
    paths:
      - build/
      - node_modules/
  only:
    - master
    - develop

test:
  stage: test
  variables:
    CI: "true"
  before_script:
    - export BATTLECHOC_NPM_TOKEN=$CI_JOB_TOKEN
    - npm i -g serve
    - nohup serve -s build/ &
  script:
    - npm run test
  artifacts:
    expire_in: 2 days
    when: always
    paths:
      - test/output/
  only:
    - master
    - develop

deploy:
  stage: deploy
  before_script:
    - export BATTLECHOC_NPM_TOKEN=$CI_JOB_TOKEN
  script:
    - npm i -g firebase-tools
    - firebase deploy --token $FIREBASE_TOKEN
  only:
    - master
