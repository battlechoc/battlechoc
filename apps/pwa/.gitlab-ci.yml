image: buildkite/puppeteer

stages:
 - build
 - test
 - deploy

cache:
  paths:
   - node_modules/
   - .yarn

build:
  stage: build
  variables:
    CI: "true"
  before_script:
    - export CI_JOB_TIMESTAMP=$(date --utc -Iseconds)
    - npm config set registry $ARTIFACTORY_URL
    - npm config set email $ARTIFACTORY_EMAIL
    - npm config set _auth $ARTIFACTORY_CREDENTIALS
    - npm config set always-auth true
    - npm install
  script:
    - sed -i "s/LOCAL_DATETIME/$CI_JOB_TIMESTAMP/g" src/ui/dialogs/Info.js
    - sed -i "s/LOCAL_DATETIME/$CI_JOB_TIMESTAMP/g" src/helper/settings.js
    - sed -i "s/NEXT_REVISION/$CI_PIPELINE_ID/g" src/custom-service-worker.js
    - npm run build
  artifacts:
    expire_in: 20 mins
    paths:
     - build/
     - node_modules/
  only:
    - master
    - develop

test:
  stage: test
  variables:
    CI: "true"
  before_script: 
    - npm i -g serve
    - nohup serve -s build/ &
  script:
    - npm run test
  artifacts:
    expire_in: 2 days
    when: always
    paths:
     - test/output/
  only:
    - master
    - develop

deploy:
  stage: deploy
  script:
    - npm i -g firebase-tools
    - firebase use battlechoc --token $FIREBASE_TOKEN
    - firebase deploy
  only:
    - master
