image: buildkite/puppeteer

stages:
 - build
 - test

cache:
  paths:
   - node_modules/
   - .yarn

build:
  stage: build
  variables:
    CI: "true"
  before_script: 
    - yarn config set cache-folder .yarn
    - yarn install 
  script:
    - yarn build
  artifacts:
    expire_in: 20 mins
    paths:
     - build/
     - node_modules/

test:
  stage: test
  variables:
    CI: "true"
  before_script: 
    - yarn config set cache-folder .yarn
    - yarn install
    - yarn global add serve
    - ls
    - ls build/static/js/
    - nohup serve -s build/ &
  script:
    - yarn test
  artifacts:
    expire_in: 2 days
    when: always
    paths:
#     - build/
     - test/output/