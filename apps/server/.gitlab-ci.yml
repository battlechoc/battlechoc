image: docker:19.03.1

stages:
 - test
 - deploy
 
services:
 - docker:dind

test:
  stage: test
  before_script:
    - apk update && apk upgrade && apk add --no-cache bash git openssh
    - apk add --update nodejs npm
    - cd functions && npm install
    - npm install -g jest
  artifacts:
    expire_in: 5 mins
    paths:
     - functions/node_modules/
  script:
    - docker run --name battlechoc-test-postgres -p 5432:5432 -e POSTGRES_PASSWORD=hackersdontcare -d postgres
    - sleep 15
    - NODE_ENV=test jest tests --coverage
    - docker stop battlechoc-test-postgres && docker container rm battlechoc-test-postgres
  coverage: /All\sfiles.*?\s+(\d+.\d+)/
  
deploy:
  stage: deploy
  script:
    - npm install -g firebase-tools
    - cd functions && firebase deploy --only functions:api --token "1/EiwBklB7W-Cdt5XSy5omXsxSI-KfKai36k4FuNOJEng"
  only:
    - master

