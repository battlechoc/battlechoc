image: docker:19.03.1

stages:
 - test
 - deploy
 
services:
 - name: docker:dind
   alias: localhost

test:
  stage: test
  before_script:
    - docker run --name battlechoc-test-postgres --net=host -e POSTGRES_PASSWORD=hackersdontcare -d postgres
    - apk update && apk upgrade && apk add --no-cache bash git openssh busybox-extras
    - telnet 0.0.0.0 5432
    - telnet docker 5432
    - telnet localhost 5432
    - telnet 127.0.0.1 5432
    - apk add --update nodejs npm
    - docker container ls
    - cd functions && npm install
    - npm install -g jest
  artifacts:
    expire_in: 5 mins
    paths:
     - functions/node_modules/
  script:
    - sleep 15
    - NODE_ENV=test jest tests --coverage
    - docker stop battlechoc-test-postgres && docker container rm battlechoc-test-postgres
  coverage: /All\sfiles.*?\s+(\d+.\d+)/
  
deploy:
  stage: deploy
  script:
    - npm install -g firebase-tools
    - cd functions && firebase deploy --only functions:api --token "1/EiwBklB7W-Cdt5XSy5omXsxSI-KfKai36k4FuNOJEng"
  only:
    - master

