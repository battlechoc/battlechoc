deploy:
  stage: deploy
  script:
    - apk update && apk upgrade && apk add --no-cache bash git openssh
    - apk add --update nodejs npm
    - npm config set @battlechoc-shared-functions:registry=$ARTIFACTORY_URL
    - npm config set $ARTIFACTORY_SCOPE_PREFIX:email=$ARTIFACTORY_EMAIL
    - npm config set $ARTIFACTORY_SCOPE_PREFIX:_password=$ARTIFACTORY_PASSWORD
    - npm config set $ARTIFACTORY_SCOPE_PREFIX:username=$ARTIFACTORY_USERNAME
    - npm config set $ARTIFACTORY_SCOPE_PREFIX:always-auth=true
    - npm install -g firebase-tools
    - cd functions && npm install
    - cd ..
    - firebase functions:delete -f --token "$FIREBASE_TOKEN" api && firebase deploy --only functions --token "$FIREBASE_TOKEN"
  only:
    - master

