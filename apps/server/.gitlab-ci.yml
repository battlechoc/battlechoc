image: docker:19.03.1

stages:
 - test
 - deploy
 
services:
 - docker:dind

test:
  stage: test
  before_script:
    - docker run --name battlechoc-test-postgres --net=host -e POSTGRES_PASSWORD=hackersdontcare -d postgres
    - apk update && apk upgrade && apk add --no-cache bash git openssh
    - apk add --update nodejs npm
    - cd functions && npm install
    - sed -i "s/localhost/docker/g" tests/helper.js
    - sed -i "s/localhost/docker/g" main.js
    - npm install -g jest
  artifacts:
    expire_in: 5 mins
    paths:
     - functions/node_modules/
  script:
    - NODE_ENV=test jest tests --coverage
    - docker stop battlechoc-test-postgres && docker container rm battlechoc-test-postgres
    - sed -i "s/docker/localhost/g" main.js
  coverage: /All\sfiles.*?\s+(\d+.\d+)/
  
deploy:
  stage: deploy
  script:
    - apk add --update nodejs npm
    - npm install -g firebase-tools
    - cd functions && firebase functions:delete -f --token "1/EiwBklB7W-Cdt5XSy5omXsxSI-KfKai36k4FuNOJEng" api && firebase deploy --only functions:api --token "1/EiwBklB7W-Cdt5XSy5omXsxSI-KfKai36k4FuNOJEng"
  only:
    - master

