name: Deploy PWA to GitHub Pages

# Deploys main to battlechoc.com once CI has passed on it (a merged pull request
# or a push), or by hand. The custom domain is set in the repository's Pages
# settings: with a workflow deployment, GitHub ignores a CNAME file.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Several merges in a row start one CI run each, and their deploys follow in
  # the order the runs finish: an older commit could be deployed last. Only the
  # commit that main is at now goes out; for an older one, the newer commit's
  # CI deploys (or, if it fails, nothing untested does).
  newest:
    # only after CI passed on a push to main: a pull request from a fork's
    # branch named main runs CI too and must not be deployed
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$main" = "$TESTED" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $main by now, not at $TESTED: its own CI run deploys it"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: newest
    if: needs.newest.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the commit CI tested, not whatever main is by now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the commit and the build time: in the Info dialog and in problem reports (src/build.js)
      - name: Build
        env:
          VITE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          # signing in with a Cardano key (src/cardano/features.js): the same network as the
          # API's CARDANO_NETWORK on the VPS (deploy/README.md). The paths that need a check on a
          # real device stay hidden until VITE_CARDANO_CONFIRMED names them (TODO.md).
          VITE_CARDANO_NETWORK: preprod
        run: VITE_BUILD_TIME=$(date --utc -Iseconds) npm run build
      - name: The published build has no test hooks
        run: npm run check:build
      - name: Prepare GitHub Pages output
        working-directory: apps/pwa/build
        run: |
          # GitHub Pages has no rewrites: serve the SPA for deep links via 404.html
          cp index.html 404.html
          # keep dot-folders such as .well-known (Digital Asset Links)
          touch .nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/pwa/build
          # the artifact drops dot-files unless told otherwise: /.well-known/assetlinks.json
          # (Digital Asset Links for the Android app) and brave-rewards-verification.txt
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # the action itself gives up on a deployment after 10 minutes
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
