name: CI

on:
  push:
    branches: [main]
  pull_request:

# a new push to a pull request cancels its older run; the runs on main all finish (each may deploy)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The pull request's title becomes the squash commit on main, and release-please reads only
  # conventional commits ("feat: …", "fix(pwa): …", "docs: …"): a title like "Dev" (PR #27) left
  # its changes out of the release. Required in the ruleset, so such a title cannot be merged.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A release pull request (release-please) changes only the version and the changelog of a main
  # that was tested on its push, so its tests are skipped; a skipped job counts as passed for the
  # required checks. The push of its merge to main runs everything before the deploy.
  test-and-build:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shared rules engine unit tests
        run: npm test
      - name: Tutorial scenarios on the engine
        run: npm run test:unit
      - name: Whitepaper economy simulator tests
        run: npm run test:whitepaper
      - name: API tests (in-memory Postgres)
        run: npm run test:api
      - name: API tests (Postgres 17)
        run: npm run test:api
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      - name: PWA production build
        run: npm run build
      - name: The published build has no test hooks
        run: "! grep -rlE '__battlechoc|testclock' apps/pwa/build"

  # The browser tests in four parallel jobs of about seven minutes each (in one job they took
  # 29 min), next to test-and-build instead of after it. Each job builds the e2e build and runs
  # the specs of its group; a spec not named in a group, a new one too, runs in "rest".
  # Rebalance by the test durations in the jobs' logs.
  e2e-group:
    name: e2e (${{ matrix.group }})
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [challenge, online, realtime, rest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # the e2e build carries the test hooks (src/testHooks.js); the published build has none
      - name: End-to-end tests of the group (builds build-e2e/, Playwright serves it via vite preview)
        working-directory: apps/pwa
        env:
          GROUP: ${{ matrix.group }}
        run: |
          challenge="test/challenge.spec.js"
          online="test/online.spec.js test/first-load.spec.js"
          realtime="test/realtime.spec.js test/lab.spec.js test/info.spec.js"
          specs=()
          if [ "$GROUP" = rest ]; then
            for spec in test/*.spec.js; do
              [[ " $challenge $online $realtime " == *" $spec "* ]] || specs+=("$spec")
            done
          else
            read -ra specs <<< "${!GROUP}"
          fi
          echo "specs: ${specs[*]}"
          npm test -- "${specs[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results-${{ matrix.group }}
          path: |
            apps/pwa/test/output
            apps/pwa/test/results
          retention-days: 2

  # the required check "e2e" (ruleset): passes when every group passed, or none ran (a release
  # pull request)
  e2e:
    needs: e2e-group
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every group passed
        env:
          RESULT: ${{ needs.e2e-group.result }}
        run: |
          echo "e2e groups: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]
