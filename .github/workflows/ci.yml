name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shared rules engine unit tests
        run: npm test
      - name: Tutorial scenarios on the engine
        run: npm run test:unit
      - name: Whitepaper economy simulator tests
        run: npm run test:whitepaper
      - name: API tests (in-memory Postgres)
        run: npm run test:api
      - name: API tests (Postgres 17)
        run: npm run test:api
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      - name: PWA production build
        run: npm run build

  e2e:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # the e2e build carries the test hooks (src/testHooks.js); the published build has none
      - name: End-to-end tests (builds build-e2e/, Playwright serves it via vite preview)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: |
            apps/pwa/test/output
            apps/pwa/test/results
          retention-days: 2
