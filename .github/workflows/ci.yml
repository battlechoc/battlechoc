name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shared rules engine unit tests
        run: npm test
      - name: PWA production build
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: pwa-build
          path: apps/pwa/build
          retention-days: 1

  e2e:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: pwa-build
          path: apps/pwa/build
      - name: Install Chrome for puppeteer
        run: npx puppeteer browsers install chrome --install-deps
      - name: End-to-end tests (jest-puppeteer serves the build via vite preview)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: apps/pwa/test/output
          retention-days: 2
