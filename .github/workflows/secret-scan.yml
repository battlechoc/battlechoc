name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  # the release pull request of release-please (release-please.yml)
  workflow_dispatch:

# The gitleaks CLI (MIT) directly: the gitleaks GitHub Action needs a license key for
# repositories of organizations. The history was scrubbed on 2026-10-14, so every finding is new.
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
      - name: Scan the commits of this push or pull request
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            range="origin/main..${{ github.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range="${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          ./gitleaks git . --log-opts="$range" --redact --no-banner --verbose
